# 家庭化学品库 — Nginx HTTPS 反向代理配置
#
# ── 首次部署顺序（重要）──────────────────────────
#
# 1. 先用 HTTP-only 配置启动 Nginx（下方 "阶段1" 块）
# 2. 运行 certbot 获取证书：
#    sudo certbot certonly --webroot -w /var/www/certbot -d 你的域名
# 3. 切换到 HTTPS 配置（下方 "阶段2" 块），重载 Nginx
# 4. 设置自动续期：sudo certbot renew --dry-run
#
# ⚠️ 不支持自签证书方案。APK 信任系统 CA，自签证书无法使用。
#    必须使用受信任 CA 签发的有效域名证书（Let's Encrypt 免费）。

# ── 阶段1：HTTP-only（首次申请证书前使用）─────────
# 取消注释此块，注释阶段2，用于首次 certbot 签发
#
# server {
#     listen 80;
#     server_name 你的域名;
#
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#
#     location / {
#         proxy_pass http://127.0.0.1:8000;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }

# ── 阶段2：HTTPS（证书签发成功后切换）─────────────
# 证书签发成功后取消注释此块，注释阶段1

server {
    listen 443 ssl http2;
    server_name PLACEHOLDER_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/PLACEHOLDER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PLACEHOLDER_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 上传图片大小限制（略大于后端 MAX_IMAGE_SIZE_MB=5）
    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# HTTP → HTTPS 重定向（证书签发后启用）
server {
    listen 80;
    server_name PLACEHOLDER_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
