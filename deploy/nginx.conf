# 家庭化学品库 — Nginx HTTPS 反向代理配置
#
# 安装：
#   1. 复制到 /etc/nginx/sites-available/homechem
#   2. ln -s /etc/nginx/sites-available/homechem /etc/nginx/sites-enabled/
#   3. certbot --nginx -d <域名>  （Let's Encrypt 自动配置证书）
#   4. nginx -t && systemctl reload nginx
#
# 如果没有域名，使用非标端口 8443 + 自签证书：
#   openssl req -x509 -newkey rsa:2048 -keyout /etc/nginx/ssl/homechem.key \
#     -out /etc/nginx/ssl/homechem.crt -days 30 -nodes \
#     -subj "/CN=<VPS公网IP>"
#   然后取消下方 8443 server 块注释

# ── 域名 + Let's Encrypt ──────────────────────────
server {
    listen 443 ssl http2;
    server_name PLACEHOLDER_DOMAIN;

    # Let's Encrypt 证书路径（certbot 自动填充）
    ssl_certificate /etc/letsencrypt/live/PLACEHOLDER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PLACEHOLDER_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 上传图片大小限制（略大于后端 MAX_IMAGE_SIZE_MB=5）
    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name PLACEHOLDER_DOMAIN;
    return 301 https://$host$request_uri;
}

# ── 无域名：IP + 非标端口 8443（免备案）──────────
