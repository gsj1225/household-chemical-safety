# 家庭化学品库 — Docker Compose 部署编排
#
# 用法：
#   1. 复制 .env.example 为 .env，填入配置
#   2. docker-compose up -d
#   3. 健康检查：curl http://localhost:8000/health

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: homechem-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data:/app/data
    env_file:
      - ../backend/.env
    environment:
      - DEBUG=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
